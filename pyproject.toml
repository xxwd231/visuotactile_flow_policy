[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visuotactile-flow-policy"
version = "0.1.0"
description = "Contracts and data interfaces for a UR5e visuotactile flow policy"
requires-python = ">=3.11"
dependencies = ["numpy", "torch", "torchvision", "PyYAML"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
